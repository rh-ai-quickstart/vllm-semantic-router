apiVersion: v1
kind: Pod
metadata:
  name: gpu-cpu-placement-test
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    cpu.example.com/node-class: mixed-cpu-amx-gpu
    cpu.example.com/phase4-applied: "true"
  containers:
    - name: test
      image: registry.access.redhat.com/ubi9/ubi
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "4"
          memory: "1Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "1Gi"
          nvidia.com/gpu: "1"
