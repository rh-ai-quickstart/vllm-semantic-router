# vLLM Semantic Router Quickstart - Helm Values

# --- Semantic Router (custom components, not from ai-architecture-charts) ---
semanticRouter:
  hfToken: ""
  image:
    repository: ghcr.io/vllm-project/semantic-router/extproc
    tag: latest
    pullPolicy: IfNotPresent
  envoy:
    image: envoyproxy/envoy:v1.35.3
  resources:
    requests:
      memory: "3Gi"
      cpu: "1"
    limits:
      memory: "6Gi"
      cpu: "2"
  modelsPersistence:
    enabled: true
    size: 20Gi

srDashboard:
  enabled: true
  image:
    repository: ghcr.io/vllm-project/semantic-router/dashboard
    tag: latest
    pullPolicy: IfNotPresent

# --- Chat UI + API (custom application) ---
chatUI:
  image:
    repository: quay.io/hacohen/vllm-semantic-router-chat-ui
    tag: latest
    pullPolicy: Always

api:
  image:
    repository: quay.io/hacohen/vllm-semantic-router-api
    tag: latest
    pullPolicy: Always

# --- Model Serving (3x llm-service via ai-architecture-charts) ---

# Research agent: Qwen3-8B with reasoning
llm-service-research:
  enabled: true
  secret:
    hf_token: ""
    enabled: true
  models:
    qwen3-8b:
      id: Qwen/Qwen3-8B
      enabled: true
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
          operator: Exists
        - key: g5-gpu
          effect: NoSchedule
          operator: Exists
      resources:
        limits:
          cpu: "4"
          memory: 32Gi
        requests:
          cpu: "2"
          memory: 16Gi
      args:
        - --max-model-len
        - "4096"
        - --max-num-seqs
        - "16"
        - --served-model-name
        - "research-agent"

# RAG backing model: Granite 3.1-8B
llm-service-rag:
  enabled: true
  secret:
    hf_token: ""
    enabled: true
  models:
    granite-3-1-8b-instruct:
      id: ibm-granite/granite-3.1-8b-instruct
      enabled: true
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
          operator: Exists
        - key: g5-gpu
          effect: NoSchedule
          operator: Exists
      resources:
        limits:
          cpu: "4"
          memory: 32Gi
        requests:
          cpu: "2"
          memory: 16Gi
      args:
        - --max-model-len
        - "4096"
        - --max-num-seqs
        - "16"
        - --served-model-name
        - "rag-agent"

# General conversation: Granite 3.1-2B
llm-service-general:
  enabled: true
  secret:
    hf_token: ""
    enabled: true
  models:
    granite-3-1-2b-instruct:
      id: ibm-granite/granite-3.1-2b-instruct
      enabled: true
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
          operator: Exists
        - key: g5-gpu
          effect: NoSchedule
          operator: Exists
      resources:
        limits:
          cpu: "2"
          memory: 16Gi
        requests:
          cpu: "1"
          memory: 8Gi
      args:
        - --max-model-len
        - "4096"
        - --max-num-seqs
        - "32"
        - --served-model-name
        - "general-agent"

# --- RAG Infrastructure ---

llama-stack:
  enabled: true
  image:
    repository: docker.io/ogxai/distribution-starter
    tag: "0.6.1"
  pgvector:
    enabled: true
  models:
    granite-3-1-8b-instruct:
      id: rag-agent
      enabled: true

pgvector:
  enabled: true
  secret:
    dbname: semantic_router

minio:
  enabled: true
  secret:
    user: ""
    password: ""

ingestion-pipeline:
  enabled: false
