# CPU Operator integration profile for an AWS g7.12xlarge-style mixed CPU/GPU worker.
# Dynamic CPU requests are generated by scripts/generate-g7-cpu-operator-values.sh.

# Qwen3-8B and Granite-3.1-8B remain GPU-backed. Their CPU request/limit values
# are supplied by the generated overlay so the total matches gpuPodReservedCPUs.

llm-service-general:
  # Keep model-specific resources instead of replacing them with the xeon
  # device defaults (16 request / 32 limit in llm-service 0.5.9).
  deviceConfigs:
    xeon:
      ignoreModelSpecificResourceSettings: false

  models:
    granite-3-1-2b-instruct:
      # Move the general model from GPU to the Intel Xeon CPU runtime.
      device: xeon

      # The base values contain GPU tolerations for this model. Clear them for
      # the CPU deployment.
      tolerations: []
