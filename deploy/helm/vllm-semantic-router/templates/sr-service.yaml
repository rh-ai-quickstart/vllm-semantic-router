apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-semantic-router.fullname" . }}-router
  labels:
    app.kubernetes.io/name: semantic-router
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: router
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8801
      targetPort: 8801
    - name: api
      port: 8080
      targetPort: 8080
    - name: listener
      port: 8899
      targetPort: 8899
    - name: metrics
      port: 9190
      targetPort: 9190
    - name: grpc
      port: 50051
      targetPort: 50051
  selector:
    app.kubernetes.io/name: semantic-router
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: router
