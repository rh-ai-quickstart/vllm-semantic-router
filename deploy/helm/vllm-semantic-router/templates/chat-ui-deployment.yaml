apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm-semantic-router.fullname" . }}-chat-ui
  labels:
    app.kubernetes.io/name: chat-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: chat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: chat-ui
          image: {{ required "chatUI.image.repository is required — run: make build-push REGISTRY=... ORG=..." .Values.chatUI.image.repository }}:{{ .Values.chatUI.image.tag }}
          imagePullPolicy: {{ .Values.chatUI.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "vllm-semantic-router.fullname" . }}-chat-ui-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-semantic-router.fullname" . }}-chat-ui
  labels:
    app.kubernetes.io/name: chat-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 8080
  selector:
    app.kubernetes.io/name: chat-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
