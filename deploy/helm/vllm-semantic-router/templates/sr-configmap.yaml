apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vllm-semantic-router.fullname" . }}-config
  labels:
    app.kubernetes.io/name: semantic-router
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    version: v0.3
    listeners:
      - name: http-8899
        address: 0.0.0.0
        port: 8899
        timeout: 300s
    providers:
      defaults:
        model: general-agent
      models:
        - name: research-agent
          reasoning:
            type: chat_template_kwargs
            parameter: enable_thinking
          provider_model_id: research-agent
          api_format: openai
          backend_refs:
            - name: research-vllm
              endpoint: qwen3-8b-vllm:80
              protocol: http
              weight: 100
              provider: vllm
        - name: rag-agent
          provider_model_id: rag-agent
          api_format: openai
          backend_refs:
            - name: rag-vllm
              endpoint: granite-3-1-8b-instruct-vllm:80
              protocol: http
              weight: 100
              provider: vllm
        - name: general-agent
          provider_model_id: general-agent
          api_format: openai
          backend_refs:
            - name: general-vllm
              endpoint: granite-3-1-2b-instruct-vllm:80
              protocol: http
              weight: 100
              provider: vllm
    routing:
      decisions:
        - name: blocked
          description: Block jailbreak and prompt injection attempts
          priority: 100
          rules:
            operator: OR
            conditions:
              - type: jailbreak
                name: detected
          modelRefs: []
        - name: pii-flagged
          description: Flag requests containing PII
          priority: 90
          rules:
            operator: OR
            conditions:
              - type: pii
                name: detected
          modelRefs:
            - model: general-agent
              use_reasoning: false
          plugins:
            - type: system_prompt
              configuration:
                enabled: true
                system_prompt: "The user's message may contain sensitive personal information. Do not repeat, store, or reference any PII."
                mode: prepend
        - name: research
          description: Route complex research and reasoning queries
          priority: 20
          rules:
            operator: OR
            conditions:
              - type: domain
                name: "computer science"
          modelRefs:
            - model: research-agent
              use_reasoning: true
        - name: rag
          description: Route knowledge-base and document queries
          priority: 15
          rules:
            operator: OR
            conditions:
              - type: keyword
                name: rag-keywords
              - type: keyword
                name: document-terms
          modelRefs:
            - model: rag-agent
              use_reasoning: false
        - name: general
          description: Default route for general conversation
          priority: 1
          rules:
            operator: OR
            conditions:
              - type: domain
                name: other
          modelRefs:
            - model: general-agent
              use_reasoning: false
      signals:
        jailbreak:
          - name: detected
            threshold: 0.7
        pii:
          - name: detected
            threshold: 0.9
            pii_types_allowed: []
        domains:
          - name: "computer science"
            description: Computer science, engineering, and technical research queries.
            mmlu_categories: ["computer science"]
          - name: health
            description: Health and medical information requests.
            mmlu_categories: [health]
          - name: other
            description: General fallback traffic.
            mmlu_categories: [other]
        keywords:
          - name: document-terms
            operator: OR
            method: bm25
            keywords: ["document", "documentation", "knowledge base", "search", "lookup", "reference"]
            case_sensitive: false
            bm25_threshold: 0.1
          - name: rag-keywords
            operator: OR
            method: bm25
            keywords: ["openshift", "red hat", "kubernetes", "container", "deployment", "operator"]
            case_sensitive: false
            bm25_threshold: 0.1
        # complexity signal disabled — requires mmBERT embeddings (ONNX status -1)
      projections:
        partitions:
          - name: request_type
            semantics: exclusive
            members:
              - "computer science"
              - health
              - other
            default: other
      modelCards:
        - name: research-agent
        - name: rag-agent
        - name: general-agent
    global:
      model_catalog:
        modules:
          prompt_guard:
            enabled: true
            use_cpu: true
            threshold: 0.7
          classifier:
            pii:
              use_mmbert_32k: false
              use_cpu: true
              threshold: 0.9
      router:
        auto_model_name: auto
        learning:
          enabled: true
          adaptation:
            enabled: false
          protection:
            enabled: true
            scope: conversation
      services:
        management_api:
          bind_address: 0.0.0.0
          port: 8080
          remote_exposure: false
        observability:
          metrics:
            enabled: true
      stores:
        response_cache:
          enabled: true
          backend_type: memory
          similarity_threshold: 0.8
          max_entries: 1000
          ttl_seconds: 3600
          eviction_policy: fifo
          embedding_model: mmbert
