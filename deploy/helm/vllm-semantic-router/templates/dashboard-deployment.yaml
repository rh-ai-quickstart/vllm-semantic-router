{{- if .Values.srDashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm-semantic-router.fullname" . }}-dashboard
  labels:
    app.kubernetes.io/name: sr-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sr-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sr-dashboard
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: dashboard
          image: {{ .Values.srDashboard.image.repository }}:{{ .Values.srDashboard.image.tag }}
          imagePullPolicy: {{ .Values.srDashboard.image.pullPolicy }}
          command: ["/bin/sh"]
          args: ["/app/start-dashboard.sh", "/app/config/config.yaml"]
          ports:
            - containerPort: 8700
              name: http
          env:
            - name: DASHBOARD_PORT
              value: "8700"
            - name: TARGET_ROUTER_API_URL
              value: http://{{ include "vllm-semantic-router.fullname" . }}-router:8080
            - name: TARGET_ROUTER_METRICS_URL
              value: http://{{ include "vllm-semantic-router.fullname" . }}-router:9190/metrics
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: {{ include "vllm-semantic-router.fullname" . }}-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-semantic-router.fullname" . }}-dashboard
  labels:
    app.kubernetes.io/name: sr-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8700
      targetPort: 8700
  selector:
    app.kubernetes.io/name: sr-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
